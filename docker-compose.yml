services:
  siliceo-agora:
    build: .
    container_name: siliceo-agora
    restart: unless-stopped
    # Nessuna porta pubblicata sull'host: accessibile solo da cloudflared sulla rete agora_internal
    expose:
      - "8095"
    environment:
      - AGORA_DB_PATH=/data/siliceo_agora.db
      - AGORA_BIND_ADDR=0.0.0.0
      - PORT=8095
      - AGORA_ADMIN_TOKEN=${AGORA_ADMIN_TOKEN}
    volumes:
      - agora_data:/data
    networks:
      - agora_internal
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 64

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: agora-tunnel
    profiles:
      - tunnel
    restart: unless-stopped
    user: "1000:1000"
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    networks:
      - agora_internal
      - egress
    depends_on:
      - siliceo-agora
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
          pids: 32

volumes:
  agora_data:
    driver: local

networks:
  # Rete interna isolata: solo siliceo-agora e cloudflared comunicano qui
  agora_internal:
    internal: true
  # Rete egress per cloudflared: connessione outbound sicura verso i server Cloudflare
  egress:
    driver: bridge
